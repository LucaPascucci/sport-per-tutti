<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software factory · dashboard</title>
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --accent: #2a78d6; --accent-soft: #dbe8f8;
    --good: #0ca30c; --good-text: #006300; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --on-fill: #ffffff; --on-warning: #0b0b0b;
    --radius: 8px; --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --accent: #3987e5; --accent-soft: #1c2f47; --good-text: #0ca30c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 var(--font); }
  header { display: flex; align-items: baseline; gap: 16px; padding: 20px 24px 8px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .meta { color: var(--ink-2); font-size: 13px; }
  main { padding: 8px 24px 32px; max-width: 1400px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 8px 0 16px; }
  .tile { background: var(--surface); border: 1px solid var(--grid); border-radius: var(--radius); padding: 12px 14px; }
  .tile .label { color: var(--ink-2); font-size: 12px; }
  .tile .value { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tile .sub { color: var(--muted); font-size: 12px; }
  .filters { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: var(--ink-2); border: 0; padding: 5px 12px; font: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  input[type=search] { background: var(--surface); color: var(--ink); border: 1px solid var(--axis); border-radius: 6px;
    padding: 5px 10px; font: inherit; min-width: 220px; }
  .card { background: var(--surface); border: 1px solid var(--grid); border-radius: var(--radius); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--ink-2); font-weight: 500; font-size: 12px; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tbody tr.job { cursor: pointer; }
  tbody tr.job:hover td { background: var(--accent-soft); }
  tbody tr.job:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .id { font-family: var(--mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .title { font-weight: 500; }
  .reason { color: var(--ink-2); font-size: 12px; margin-top: 2px; max-width: 520px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 9px 1px 7px;
    font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--on-fill); background: var(--accent); }
  .badge.good { background: var(--good); }
  .badge.warning { background: var(--warning); color: var(--on-warning); }
  .badge.serious { background: var(--serious); }
  .badge.critical { background: var(--critical); }
  .badge.muted { background: transparent; color: var(--ink-2); border: 1px solid var(--axis); }
  .badge.idle { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .pipe { display: flex; gap: 2px; margin-top: 6px; width: 132px; }
  .pipe span { flex: 1; height: 4px; border-radius: 2px; background: var(--grid); }
  .pipe span.done { background: var(--accent); }
  .pipe span.now { background: var(--ink); }
  .chip { display: inline-block; border: 1px solid var(--axis); border-radius: 4px; padding: 0 6px; font-size: 12px;
    color: var(--ink-2); margin: 0 4px 2px 0; }
  .running { color: var(--accent); font-size: 12px; font-weight: 600; }
  tr.detail td { background: var(--page); padding: 12px 16px 16px; }
  .steps th, .steps td { border-bottom: 1px solid var(--grid); padding: 5px 8px; font-size: 13px; }
  .steps td.sum { color: var(--ink-2); max-width: 520px; }
  .verdict { font-weight: 600; font-size: 12px; white-space: nowrap; }
  .v-ok { color: var(--good-text); } .v-ko { color: var(--critical); } .v-wait { color: var(--ink-2); }
  a, .link { color: var(--accent); cursor: pointer; text-decoration: underline; background: none; border: 0; padding: 0; font: inherit; }
  .empty { padding: 32px; text-align: center; color: var(--ink-2); }
  .error { margin: 12px 0; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--critical); background: var(--surface); }
  dialog { max-width: min(900px, 94vw); width: 100%; border: 1px solid var(--grid); border-radius: var(--radius);
    background: var(--surface); color: var(--ink); padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog header { padding: 12px 16px; border-bottom: 1px solid var(--grid); justify-content: space-between; }
  dialog pre { margin: 0; padding: 16px; white-space: pre-wrap; font: 12.5px/1.5 var(--mono); max-height: 75vh; overflow: auto; }
  .detail-meta { display: flex; gap: 18px; flex-wrap: wrap; color: var(--ink-2); font-size: 12px; margin-bottom: 8px; }
  .detail-meta b { color: var(--ink); font-weight: 600; }
  @media (forced-colors: active) { .badge, .pipe span { border: 1px solid CanvasText; } }
</style>
</head>
<body>
<header>
  <h1>Software factory</h1>
  <span class="meta" id="repo"></span>
  <span class="meta" id="updated" aria-live="polite"></span>
</header>
<main>
  <div id="error" class="error" hidden></div>
  <section class="kpis" aria-label="Riepilogo">
    <div class="tile"><div class="label">Job in lavorazione</div><div class="value" id="k-active">–</div><div class="sub" id="k-active-sub">&nbsp;</div></div>
    <div class="tile"><div class="label">In attesa di una persona</div><div class="value" id="k-human">–</div><div class="sub">needs-human + needs-info</div></div>
    <div class="tile"><div class="label">Pronti per la PR/MR</div><div class="value" id="k-done">–</div><div class="sub" id="k-done-sub">&nbsp;</div></div>
    <div class="tile"><div class="label">Costo stimato totale</div><div class="value" id="k-cost">–</div><div class="sub">prezzo equivalente API</div></div>
  </section>
  <div class="filters">
    <div class="seg" role="group" aria-label="Filtro stato">
      <button type="button" data-filter="open" aria-pressed="true">Aperti</button>
      <button type="button" data-filter="human" aria-pressed="false">Da decidere</button>
      <button type="button" data-filter="all" aria-pressed="false">Tutti</button>
    </div>
    <input type="search" id="q" placeholder="Cerca per id o titolo" aria-label="Cerca job">
  </div>
  <div class="card">
    <table>
      <thead><tr>
        <th>Job</th><th>Stadio</th><th>Rischio</th><th>Superfici</th><th class="num">Ciclo · round</th>
        <th class="num">Tempo</th><th class="num">Costo</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>Nessun job da mostrare.</div>
  </div>
</main>
<dialog id="viewer" aria-labelledby="viewer-title">
  <header><strong id="viewer-title"></strong><button class="link" id="viewer-close" type="button">Chiudi</button></header>
  <pre id="viewer-body"></pre>
</dialog>
<script>
const PIPE = ["intake", "spec", "build", "gate", "review", "approval", "final-gate", "done"];
const STAGE = {
  "intake":      {label: "intake",            cls: "",         icon: "▸"},
  "route":       {label: "routing",           cls: "",         icon: "▸"},
  "spec":        {label: "spec",              cls: "",         icon: "▸"},
  "build":       {label: "build",             cls: "",         icon: "▸"},
  "gate":        {label: "gate",              cls: "",         icon: "▸"},
  "review":      {label: "review",            cls: "",         icon: "▸"},
  "approval":    {label: "approvazione",      cls: "",         icon: "▸"},
  "final-gate":  {label: "gate finale",       cls: "",         icon: "▸"},
  "done":        {label: "pronto",            cls: "good",     icon: "✓"},
  "needs-human": {label: "serve una persona", cls: "serious",  icon: "!"},
  "needs-info":  {label: "domanda all'autore",cls: "warning",  icon: "?"},
  "rejected":    {label: "rifiutato",         cls: "muted",    icon: "×"},
  "closed":      {label: "chiuso",            cls: "muted",    icon: "–"},
};
const OK = new Set(["ACCEPT", "DONE", "PASS", "APPROVE"]);
const KO = new Set(["REJECT", "FAIL", "ERROR", "CHANGES", "ESCALATE", "BLOCKED"]);
let data = null, filter = "open", query = "", openId = null, currency = "USD";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (v) => (v == null ? "–" : new Intl.NumberFormat("it-IT", {style: "currency", currency, minimumFractionDigits: 2, maximumFractionDigits: 2}).format(v));
function dur(s) {
  if (s == null) return "–";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (h) return `${h}h ${String(m).padStart(2, "0")}m`;
  if (m) return `${m}m ${String(s % 60).padStart(2, "0")}s`;
  return `${s}s`;
}
function secs(a, b) { if (!a) return null; const t1 = Date.parse(a), t2 = b ? Date.parse(b) : Date.now(); return Math.max(0, (t2 - t1) / 1000); }
const isOpen = (j) => !["done", "rejected", "closed"].includes(j.stage);
const isHuman = (j) => j.stage === "needs-human" || j.stage === "needs-info";

function badge(stage) {
  const s = STAGE[stage] || {label: stage, cls: "", icon: "▸"};
  return `<span class="badge ${s.cls}"><span aria-hidden="true">${s.icon}</span>${esc(s.label)}</span>`;
}
function pipe(job) {
  const lastRunnable = [...(job.steps || [])].reverse().find((st) => PIPE.includes(st.stage));
  const stage = PIPE.includes(job.stage) ? job.stage : (lastRunnable ? lastRunnable.stage : "intake");
  const idx = PIPE.indexOf(stage);
  const cells = PIPE.map((p, i) => `<span class="${i < idx || job.stage === "done" ? "done" : i === idx ? "now" : ""}" title="${p}"></span>`).join("");
  return `<div class="pipe" role="img" aria-label="Avanzamento: ${esc(stage)} (${idx + 1} di ${PIPE.length})">${cells}</div>`;
}
function verdict(v, status) {
  if (status === "running") return `<span class="verdict v-wait">in corso</span>`;
  if (status === "interrupted") return `<span class="verdict v-wait">interrotto</span>`;
  if (status === "failed") return `<span class="verdict v-ko">× errore</span>`;
  if (!v) return "";
  if (OK.has(v)) return `<span class="verdict v-ok">✓ ${esc(v)}</span>`;
  if (KO.has(v)) return `<span class="verdict v-ko">× ${esc(v)}</span>`;
  return `<span class="verdict">${esc(v)}</span>`;
}

function detailRow(job) {
  const reviewers = (job.routing || []).map((r) => `${esc(r.role)} <b>${esc(r.model)}</b>`).join(" · ") || "–";
  const steps = (job.steps || []).map((st) => `
    <tr>
      <td class="num">${st.n}</td>
      <td class="num">c${st.cycle} r${st.round}</td>
      <td>${esc(st.role)}</td>
      <td>${esc(st.model || "script")}</td>
      <td>${verdict(st.verdict, st.status)}</td>
      <td class="num">${dur(secs(st.started_at, st.ended_at))}</td>
      <td class="num">${st.cost_usd == null ? "–" : money(st.cost_usd)}</td>
      <td class="sum">${esc(st.summary || "")}</td>
      <td>${st.report ? `<button class="link" data-file="jobs/${esc(job.id)}/${esc(st.report)}">report</button>` : ""}
          ${st.log ? ` · <button class="link" data-file="jobs/${esc(job.id)}/${esc(st.log)}">log</button>` : ""}</td>
    </tr>`).join("");
  const files = ["request.md", "spec.md", "PR.md", "HANDOFF.md"].map((f) =>
    `<button class="link" data-file="jobs/${esc(job.id)}/${f}">${f}</button>`).join(" · ");
  return `<tr class="detail"><td colspan="7">
    <div class="detail-meta">
      <span>Branch <b>${esc(job.branch)}</b> su <b>${esc(job.base)}</b></span>
      <span>Reviewer: ${reviewers}</span>
      <span>Etichette: ${(job.labels || []).map((l) => `<span class="chip">${esc(l)}</span>`).join("") || "–"}</span>
      <span>File: ${files}</span>
    </div>
    ${job.question ? `<p><b>Domanda aperta:</b> ${esc(job.question)}</p>` : ""}
    <table class="steps">
      <thead><tr><th class="num">#</th><th class="num">Ciclo</th><th>Ruolo</th><th>Modello</th><th>Esito</th>
        <th class="num">Durata</th><th class="num">Costo</th><th>Sintesi</th><th></th></tr></thead>
      <tbody>${steps || `<tr><td colspan="9" class="v-wait">Nessuno step ancora.</td></tr>`}</tbody>
    </table>
  </td></tr>`;
}

function render() {
  if (!data) return;
  currency = data.currency || "USD";
  const jobs = data.jobs || [];
  $("repo").textContent = `${data.repo} · concorrenza ${data.concurrency} · max ${data.max_rounds} round`;
  const active = jobs.filter((j) => isOpen(j) && !isHuman(j));
  const running = jobs.filter((j) => (j.active || []).length);
  $("k-active").textContent = active.length;
  $("k-active-sub").textContent = `${running.length} con agenti in esecuzione`;
  $("k-human").textContent = jobs.filter(isHuman).length;
  $("k-done").textContent = jobs.filter((j) => j.stage === "done").length;
  $("k-done-sub").textContent = `${jobs.filter((j) => j.stage === "rejected" || j.stage === "closed").length} rifiutati o chiusi`;
  $("k-cost").textContent = money(jobs.reduce((a, j) => a + (j.cost_usd || 0), 0));

  const q = query.trim().toLowerCase();
  const shown = jobs
    .filter((j) => filter === "all" || (filter === "open" ? isOpen(j) : isHuman(j)))
    .filter((j) => !q || j.id.toLowerCase().includes(q) || (j.title || "").toLowerCase().includes(q))
    .sort((a, b) => (isHuman(b) - isHuman(a)) || (b.seq - a.seq));
  $("empty").hidden = shown.length > 0;
  $("rows").innerHTML = shown.map((j) => {
    const runningTxt = (j.active || []).length ? `<div class="running">▶ ${j.active.map(esc).join(", ")}</div>` : "";
    const row = `<tr class="job" tabindex="0" data-id="${esc(j.id)}" aria-expanded="${openId === j.id}">
      <td><div class="title">${esc(j.title)}</div><div class="id">${esc(j.id)}</div>
        ${j.status_reason ? `<div class="reason">${esc(j.status_reason)}</div>` : ""}</td>
      <td>${badge(j.stage)}${pipe(j)}${runningTxt}</td>
      <td>${esc(j.risk || "–")}</td>
      <td>${(j.surfaces || []).map((s) => `<span class="chip">${esc(s)}</span>`).join("") || "–"}</td>
      <td class="num">${j.cycle} · ${j.round}/${data.max_rounds}</td>
      <td class="num">${dur(j.finished_at ? secs(j.created_at, j.finished_at) : secs(j.created_at))}</td>
      <td class="num">${money(j.cost_usd)}</td>
    </tr>`;
    return row + (openId === j.id ? detailRow(j) : "");
  }).join("");
}

async function load() {
  try {
    const res = await fetch(`jobs/index.json?t=${Date.now()}`, {cache: "no-store"});
    if (!res.ok) throw new Error(res.status === 404 ? "jobs/index.json non trovato: nessun job ancora creato." : `HTTP ${res.status}`);
    data = await res.json();
    $("error").hidden = true;
    $("updated").textContent = `aggiornato alle ${new Date().toLocaleTimeString("it-IT")}`;
    render();
  } catch (err) {
    const hint = location.protocol === "file:"
      ? "Apri la dashboard tramite server: <code>cd factory &amp;&amp; python3 -m http.server</code> e vai su <code>http://localhost:8000/dashboard.html</code>."
      : esc(err.message);
    $("error").innerHTML = hint;
    $("error").hidden = false;
  }
}

async function openFile(path) {
  $("viewer-title").textContent = path;
  $("viewer-body").textContent = "Caricamento…";
  $("viewer").showModal();
  try {
    const res = await fetch(`${path}?t=${Date.now()}`, {cache: "no-store"});
    $("viewer-body").textContent = res.ok ? await res.text() : `File non disponibile (HTTP ${res.status}).`;
  } catch (err) { $("viewer-body").textContent = String(err); }
}

$("rows").addEventListener("click", (e) => {
  const file = e.target.closest("[data-file]");
  if (file) { e.stopPropagation(); openFile(file.dataset.file); return; }
  const tr = e.target.closest("tr.job");
  if (tr) { openId = openId === tr.dataset.id ? null : tr.dataset.id; render(); }
});
$("rows").addEventListener("keydown", (e) => {
  const tr = e.target.closest("tr.job");
  if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openId = openId === tr.dataset.id ? null : tr.dataset.id; render(); }
});
document.querySelectorAll("[data-filter]").forEach((b) => b.addEventListener("click", () => {
  filter = b.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  render();
}));
$("q").addEventListener("input", (e) => { query = e.target.value; render(); });
$("viewer-close").addEventListener("click", () => $("viewer").close());

load();
setInterval(load, 5000);
</script>
</body>
</html>
